[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "videotranslator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "starlette==1.6.0", "uvicorn==0.53.0", "python-multipart==0.0.32",
  "pydantic-settings==2.9.1", "sqlalchemy==2.0.41", "psycopg[binary]==3.2.9",
  "celery[redis]==5.5.3", "httpx==0.28.1", "numpy==2.2.6", "soundfile==0.13.1",
  "yt-dlp[default]==2026.8.19"
]
[project.optional-dependencies]
test = ["pytest==9.1.1"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["tests"]
