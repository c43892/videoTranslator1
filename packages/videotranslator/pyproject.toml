[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videotranslator"
version = "2.0.0"
description = "VideoTranslator 2.0 — control plane + worker for long-running media translation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
cloud = [
    "httpx>=0.27",
    "azure-identity",
    "azure-storage-blob",
    "azure-ai-ml",
    "azure-mgmt-appcontainers",
    "firebase-admin",
]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["videotranslator*"]

[tool.pytest.ini_options]
testpaths = ["../../tests/unit"]
